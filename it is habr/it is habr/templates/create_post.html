<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить новость</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 150px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 15px; cursor: pointer; }
        button:hover { background: #45a049; }
        .flash-message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .error { background: #ffdddd; color: #d8000c; }
        .success { background: #ddffdd; color: #4F8A10; }
    </style>
</head>
<body>
    <h1>Добавить новость</h1>
    
    <!-- Flash-сообщения -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('create_post') }}"  enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Заголовок*</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <div class="form-group">
            <label for="content">Текст новости*</label>
            <textarea id="content" name="content" required></textarea>
        </div>

        <div class="form-group">
            <label for="image">Изображение</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        
        <div class="form-group">
            <label for="author">Автор*</label>
            <input type="text" id="author" name="author" required>
        </div>
        
        <div class="form-group">
            <label for="tags">Теги (через запятую)</label>
            <input type="text" id="tags" name="tags" placeholder="python, mongodb, flask">
        </div>
        
        <button type="submit">Опубликовать</button>
    </form>
    
    <p><a href="{{ url_for('news_feed') }}">← Назад к ленте</a></p>
</body>
</html>
